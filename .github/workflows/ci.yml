name: CI

# Every PR and main push is checked. Only explicitly allowlisted documentation
# avoids the application suites; unknown paths and unavailable history run them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A later documentation push must not cancel application acceptance.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  changes:
    name: Delivery classification and tracker checks
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Dependency-free safety tests run even on the lightweight docs path.
      - run: node --test scripts/delivery-changes.test.mjs scripts/staging-release.test.mjs remediation/tools/progress.test.mjs
      - id: classify
        name: Classify the entire push or PR range
        run: node scripts/delivery-changes.mjs
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node remediation/tools/progress.mjs validate
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-decision
          path: delivery-decision.json
          retention-days: 14
          if-no-files-found: error

  quality:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the build input.
      - run: npm ci

      # The client and server import @spoh/shared, and the server
      # @spoh/access-policies, from their built output, so both have to exist
      # before anything else compiles.
      - run: npm run build:shared
      - run: npm run settings:check
      - run: npm run actions:check
      - run: npm run check:pricing
      - run: npm run check:firebase

      # prisma.config.ts refuses to load without DATABASE_URL, even though
      # generate never connects. A placeholder satisfies it.
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build --workspace client
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid

  test:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spoh
          POSTGRES_PASSWORD: spoh
          POSTGRES_DB: spoh2027_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spoh -d spoh2027_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # The unit suite reads DATABASE_URL; the integration suite takes
      # TEST_DATABASE_URL, because it deletes every row it finds and its
      # truncation guard requires a database name ending in _test.
      DATABASE_URL: postgresql://spoh:spoh@localhost:5432/spoh2027_test
      TEST_DATABASE_URL: postgresql://spoh:spoh@localhost:5432/spoh2027_test
      AUTH_PROVIDER: local
      LOCAL_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      SESSION_SIGNING_SECRET: test-only-shared-session-secret-at-least-thirty-two-chars
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SPOH_SKIP_DOTENV: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # Compare floors to the PR base or previous main commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      # Prisma 7's migrate no longer generates the client, and src/generated
      # is not committed, so the suites cannot load platform/db/client.ts without this.
      - run: npx prisma generate
        working-directory: server

      - run: npx prisma migrate deploy
        working-directory: server

      - name: Shared contract tests
        run: npm run test:coverage --workspace packages/shared

      - name: Cedar schema, policies and generated catalogue
        run: npm run test --workspace packages/access-policies

      - name: Infrastructure definition tests
        run: npm run test --workspace infra/cdk

      # One instrumented run includes both projects; the integration project
      # still serialises files against this job's dedicated PostgreSQL database.
      - name: Server unit and integration coverage
        run: npm run test:coverage --workspace server

      - name: Client coverage
        run: npm run test:coverage --workspace client

      - name: Application coverage ratchet
        run: npm run check:coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Save coverage measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          retention-days: 7
          if-no-files-found: error
          path: |
            packages/shared/coverage/coverage-summary.json
            packages/shared/coverage/lcov.info
            server/coverage/coverage-summary.json
            server/coverage/lcov.info
            client/coverage/coverage-summary.json
            client/coverage/lcov.info

  architecture:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    # Blocking: any boundary violation fails the build (server, shared and cycles
    # since P06.10, the client since P07.9). The size guards are lint errors in the
    # quality job; the guard counts here are a report.
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      # The boundary rules resolve imports of the generated Prisma client.
      # As in the quality job, generate needs only a placeholder DATABASE_URL.
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused

      - name: Guard counts
        continue-on-error: true
        run: |
          npm run --silent arch:report | tee arch-report.txt
          { echo '```'; cat arch-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Boundary violations
        run: npm run arch:check

      # No event-specific literal in source: events, days and zones are data (P09.11).
      - name: No hardcoded event values
        run: npm run check:hardcoding

  security:
    name: Secret scan and applicable dependency audit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.full_ci == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
        if: needs.changes.outputs.full_ci == 'true'

      # Fails the build on a high or critical advisory (BUILD_PLAN §8.6), save
      # the narrow, expiring exceptions in scripts/audit-exceptions.json.
      - name: Dependency audit
        if: needs.changes.outputs.full_ci == 'true'
        run: node scripts/audit.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
