name: Infra

# Proves the CI path into AWS (P08.2): GitHub's OIDC token, the spoh-github-deploy
# role, and the CDK bootstrap roles, with no static keys anywhere. P08.9 grows
# this into the staging deploy.
# Manual only while AWS is torn down (10 October 2026, ADR-011); see deploy-staging.yml.
on:
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: ap-southeast-1
  DEPLOY_ROLE: arn:aws:iam::665146708212:role/spoh-github-deploy

jobs:
  diff:
    name: cdk diff (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: cdk diff
        working-directory: infra/cdk
        run: npx cdk diff Spoh-staging-Platform Spoh-DeployAccess

      # P11.6: the deployed policy store holds exactly avp/policy-store.json.
      - name: AVP drift (staging)
        working-directory: infra/cdk
        run: |
          id=$(aws cloudformation describe-stacks --stack-name Spoh-staging-Platform             --query "Stacks[0].Outputs[?starts_with(OutputKey,'Authorization')].OutputValue" --output text)
          npx tsx bin/avp-drift.ts "$id" "$AWS_REGION"
