# SPOH 2027 reverse proxy.
#
# Two upstreams on one origin: the API on 4010, the Next.js client on 3000.
# One origin is deliberate — it is what lets the refresh cookie stay
# SameSite=Lax and keeps SESSION_COOKIE_CROSS_SITE=false.
#
# Certbot rewrites this file when it installs a certificate: it adds the
# `listen 443 ssl` block, the cert paths and the port-80 redirect. Keep this
# copy as the pre-certbot state, and re-run certbot after replacing it.

server {
    listen 80;
    listen [::]:80;
    server_name spoh2027.duckdns.org;

    # ACME http-01 must stay reachable over plaintext or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spoh2027.duckdns.org;

    # Certbot manages these four lines.
    ssl_certificate     /etc/letsencrypt/live/spoh2027.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spoh2027.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # The app sets its own CSP, HSTS and frame-ancestors through helmet.
    # Duplicating them here would produce two conflicting headers, and the
    # browser takes the most restrictive of each — which is how a working CSP
    # becomes a blank page.

    # A roster CSV or an Excel export is the largest thing that crosses this
    # proxy. The API refuses oversized bodies itself; this stops nginx
    # buffering them to disk first.
    client_max_body_size 12m;

    # Volunteers are on campus wifi and mobile data. A slow upload is normal
    # here and should not be cut off mid-capture.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # X-Forwarded-For is what TRUST_PROXY_HOPS=1 reads to recover the real
    # client address. Without it every request looks like 127.0.0.1 and per-IP
    # rate limiting collapses into one shared bucket for the whole event.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:4010;
    }

    # Probed by uptime checks and by the deploy runbook. Kept out of /api/ so
    # a health check never carries an Authorization header.
    location = /healthz { proxy_pass http://127.0.0.1:4010; access_log off; }
    location = /readyz  { proxy_pass http://127.0.0.1:4010; access_log off; }

    # Next.js build output is content-hashed, so it can be cached hard. This is
    # most of the bytes a volunteer's phone downloads on first load.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        # Next.js dev overlay and future streaming responses need these.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
